<!-- Calendário de Vencimentos — componente card-vencimentos (registrado localmente no CardRadar).
     Dados: statsPreCalculados.distribuicaoVencimentos + listaAtivas -->
<template id="card-vencimentos-template">
  <div style="width:100%;font-family:'Plus Jakarta Sans',sans-serif;">


    <!-- ═══════════════════════════════════════════════════════════
         CARD PRINCIPAL
         ═══════════════════════════════════════════════════════════ -->
    <div class="premium-card" style="padding:0;overflow:hidden;">

      <!-- Skeleton -->
      <div v-if="isEmpty" style="padding:1.5rem;">
        <div style="height:22px;width:220px;border-radius:var(--radius-sm);
                    background:var(--surface-overlay);margin-bottom:1.25rem;
                    animation:cv-pulse 1.5s ease infinite;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;margin-bottom:1.25rem;">
          <div v-for="n in 3" :key="n"
            style="height:72px;border-radius:var(--radius-md);background:var(--surface-overlay);
                   animation:cv-pulse 1.5s ease infinite;"></div>
        </div>
        <div v-for="n in 4" :key="'r'+n"
          style="height:48px;border-radius:var(--radius-sm);background:var(--surface-overlay);
                 margin-bottom:0.375rem;animation:cv-pulse 1.5s ease infinite;"></div>
      </div>

      <!-- Conteúdo -->
      <div v-else>

        <!-- Header -->
        <div style="padding:1.25rem 1.5rem 1rem;display:flex;justify-content:space-between;
                    align-items:center;border-bottom:1px solid var(--border-subtle);">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <div style="width:32px;height:32px;border-radius:var(--radius-md);flex-shrink:0;
                        background:var(--brand-indigo-light);border:1px solid var(--brand-indigo-muted);
                        display:flex;align-items:center;justify-content:center;">
              <i data-lucide="calendar-clock" style="width:16px;height:16px;color:var(--brand-indigo);"></i>
            </div>
            <div>
              <div class="t-title" style="color:var(--text-primary);">Calendário de Vencimentos</div>
              <div class="t-label" style="color:var(--text-muted);margin-top:2px;">
                Clique em uma linha para ver as posições do vencimento
              </div>
            </div>
          </div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:700;
                       color:var(--brand-indigo);background:var(--brand-indigo-light);
                       border:1px solid var(--brand-indigo-muted);padding:3px 10px;
                       border-radius:99px;text-transform:uppercase;letter-spacing:0.08em;
                       white-space:nowrap;">
            {{ vencimentos.length }} datas · {{ totalPosicoes }} pos
          </span>
        </div>

        <!-- Buckets de urgência -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;
                    border-bottom:1px solid var(--border-subtle);">

          <div style="padding:0.875rem 1rem;border-right:1px solid var(--border-subtle);text-align:center;">
            <div style="font-size:0.56rem;font-weight:700;color:var(--brand-rose);
                        text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;">Urgente ≤15d</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800;
                        color:var(--brand-rose);line-height:1;">{{ urgente.pos }}</div>
            <div style="font-size:0.58rem;color:var(--text-muted);margin-top:3px;">
              pos · {{ urgente.datas }} exp
            </div>
          </div>

          <div style="padding:0.875rem 1rem;border-right:1px solid var(--border-subtle);text-align:center;">
            <div style="font-size:0.56rem;font-weight:700;color:var(--brand-amber);
                        text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;">Atenção 16–45d</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800;
                        color:var(--brand-amber);line-height:1;">{{ atencao.pos }}</div>
            <div style="font-size:0.58rem;color:var(--text-muted);margin-top:3px;">
              pos · {{ atencao.datas }} exp
            </div>
          </div>

          <div style="padding:0.875rem 1rem;text-align:center;">
            <div style="font-size:0.56rem;font-weight:700;color:var(--brand-emerald);
                        text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;">Conforto >45d</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800;
                        color:var(--brand-emerald);line-height:1;">{{ conforto.pos }}</div>
            <div style="font-size:0.58rem;color:var(--text-muted);margin-top:3px;">
              pos · {{ conforto.datas }} exp
            </div>
          </div>

        </div>

        <!-- Cabeçalho de colunas (desktop) -->
        <div v-if="!isMobile"
          style="display:grid;grid-template-columns:80px 1fr 52px 1fr 1fr 1fr;
                 padding:0.5rem 1.5rem;background:var(--surface-sunken);
                 border-bottom:1px solid var(--border-subtle);">
          <div class="t-label" style="color:var(--text-muted);">DTE</div>
          <div class="t-label" style="color:var(--text-muted);">Vencimento</div>
          <div class="t-label" style="color:var(--text-muted);text-align:center;">Pos.</div>
          <div class="t-label" style="color:var(--text-muted);text-align:right;">Nocional</div>
          <div class="t-label" style="color:var(--text-muted);text-align:right;">Ganho Máx</div>
          <div class="t-label" style="color:var(--text-muted);text-align:right;">P/L Aberto</div>
        </div>

        <!-- Linhas de vencimento -->
        <div>
          <div v-for="(v, idx) in vencimentos" :key="v.dataVencimento"
            style="border-bottom:1px solid var(--border-subtle);padding:0 1.5rem;
                   cursor:pointer;transition:background 0.15s;"
            :style="(idx % 2 === 1) ? 'background:var(--surface-sunken);' : 'background:var(--surface-base);'"
            @click="abrirDrawer(v)"
            @mouseover="$event.currentTarget.style.background='var(--surface-overlay)'"
            @mouseout="$event.currentTarget.style.background=(idx % 2 === 1) ? 'var(--surface-sunken)' : 'var(--surface-base)'">

            <!-- Desktop -->
            <div v-if="!isMobile"
              style="display:grid;grid-template-columns:80px 1fr 52px 1fr 1fr 1fr;
                     padding:0.75rem 0;align-items:center;">

              <!-- DTE badge -->
              <div>
                <span style="display:inline-block;padding:3px 9px;border-radius:99px;
                             font-family:'JetBrains Mono',monospace;font-size:0.65rem;
                             font-weight:800;border:1.5px solid;white-space:nowrap;"
                  :style="'color:'+corDTE(calcDTE(v.dataVencimento)).text
                         +';background:'+corDTE(calcDTE(v.dataVencimento)).bg
                         +';border-color:'+corDTE(calcDTE(v.dataVencimento)).border+';'">
                  {{ calcDTE(v.dataVencimento) }}d
                </span>
              </div>

              <!-- Data + label -->
              <div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;
                            font-weight:700;color:var(--text-primary);">
                  {{ fmtData(v.dataVencimento) }}
                </div>
                <div style="font-size:0.56rem;font-weight:700;text-transform:uppercase;
                            letter-spacing:0.06em;margin-top:1px;"
                  :style="'color:'+corDTE(calcDTE(v.dataVencimento)).text+';'">
                  {{ corDTE(calcDTE(v.dataVencimento)).label }}
                </div>
              </div>

              <!-- Contagem -->
              <div style="text-align:center;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.9rem;
                             font-weight:800;color:var(--text-primary);">{{ v.contagem }}</span>
              </div>

              <!-- Nocional + barra -->
              <div style="text-align:right;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;
                            font-weight:700;color:var(--text-primary);">
                  {{ fmtK(v.nocional) }}
                </div>
                <div style="margin-top:5px;height:3px;border-radius:99px;background:var(--border-subtle);">
                  <div style="height:100%;border-radius:99px;transition:width 0.4s ease;"
                    :style="'width:'+barPct(v.nocional)+'%;background:'
                           +corDTE(calcDTE(v.dataVencimento)).text+';'"></div>
                </div>
              </div>

              <!-- Ganho Máx -->
              <div style="text-align:right;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;
                            font-weight:700;color:var(--brand-emerald);">
                  {{ fmtK(v.ganhoMaximo) }}
                </div>
                <div style="font-size:0.56rem;color:var(--text-muted);margin-top:1px;">
                  {{ yieldStr(v.ganhoMaximo, v.nocional) }}
                </div>
              </div>

              <!-- P/L Aberto -->
              <div style="text-align:right;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:700;"
                  :style="(parseFloat(v.plAberto)||0) >= 0
                          ? 'color:var(--brand-emerald)' : 'color:var(--brand-rose)'">
                  {{ fmtSigned(v.plAberto) }}
                </div>
                <div style="font-size:0.56rem;color:var(--text-muted);margin-top:1px;">
                  {{ plPctStr(v.plAberto, v.nocional) }}
                </div>
              </div>

            </div>

            <!-- Mobile -->
            <div v-else style="padding:0.875rem 0;">

              <!-- Linha 1: DTE + data + contagem -->
              <div style="display:flex;justify-content:space-between;align-items:center;
                          margin-bottom:0.625rem;">
                <div style="display:flex;align-items:center;gap:0.5rem;">
                  <span style="display:inline-block;padding:3px 8px;border-radius:99px;
                               font-family:'JetBrains Mono',monospace;font-size:0.65rem;
                               font-weight:800;border:1.5px solid;"
                    :style="'color:'+corDTE(calcDTE(v.dataVencimento)).text
                           +';background:'+corDTE(calcDTE(v.dataVencimento)).bg
                           +';border-color:'+corDTE(calcDTE(v.dataVencimento)).border+';'">
                    {{ calcDTE(v.dataVencimento) }}d
                  </span>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:0.88rem;
                               font-weight:700;color:var(--text-primary);">
                    {{ fmtData(v.dataVencimento) }}
                  </span>
                </div>
                <div style="display:flex;align-items:center;gap:0.375rem;">
                  <span style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;
                               font-weight:700;color:var(--text-secondary);">
                    {{ v.contagem }} pos
                  </span>
                  <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--text-muted);"></i>
                </div>
              </div>

              <!-- Métricas 3 colunas -->
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;
                          margin-bottom:0.625rem;">
                <div>
                  <div class="t-label" style="color:var(--text-muted);margin-bottom:2px;">Nocional</div>
                  <div style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;
                              font-weight:700;color:var(--text-primary);">{{ fmtK(v.nocional) }}</div>
                </div>
                <div>
                  <div class="t-label" style="color:var(--text-muted);margin-bottom:2px;">Ganho Máx</div>
                  <div style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;
                              font-weight:700;color:var(--brand-emerald);">{{ fmtK(v.ganhoMaximo) }}</div>
                </div>
                <div>
                  <div class="t-label" style="color:var(--text-muted);margin-bottom:2px;">P/L</div>
                  <div style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;font-weight:700;"
                    :style="(parseFloat(v.plAberto)||0) >= 0
                            ? 'color:var(--brand-emerald)' : 'color:var(--brand-rose)'">
                    {{ fmtSigned(v.plAberto) }}
                  </div>
                </div>
              </div>

              <!-- Barra nocional -->
              <div style="height:3px;border-radius:99px;background:var(--border-subtle);">
                <div style="height:100%;border-radius:99px;"
                  :style="'width:'+barPct(v.nocional)+'%;background:'
                         +corDTE(calcDTE(v.dataVencimento)).text+';'"></div>
              </div>
            </div>

          </div>
        </div>

        <!-- Rodapé totais -->
        <div style="padding:0.875rem 1.5rem;background:var(--surface-sunken);
                    display:flex;justify-content:space-between;align-items:center;
                    flex-wrap:wrap;gap:0.75rem;">
          <div class="t-label" style="color:var(--text-muted);text-transform:uppercase;">
            Total do Portfólio
          </div>
          <div style="display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;">
            <div>
              <span class="t-label" style="color:var(--text-muted);margin-right:0.375rem;">Nocional</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;
                           font-weight:700;color:var(--text-primary);">{{ fmtMoeda(totais.nocional) }}</span>
            </div>
            <div>
              <span class="t-label" style="color:var(--text-muted);margin-right:0.375rem;">Ganho Máx</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;
                           font-weight:700;color:var(--brand-emerald);">{{ fmtMoeda(totais.ganhoMaximo) }}</span>
            </div>
            <div>
              <span class="t-label" style="color:var(--text-muted);margin-right:0.375rem;">P/L Aberto</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:700;"
                :style="totais.plAberto >= 0 ? 'color:var(--brand-emerald)' : 'color:var(--brand-rose)'">
                {{ fmtSigned(totais.plAberto) }}
              </span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</template>

<style>
  @keyframes cv-pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
</style>

<script>
window.CardVencimentos = {
  props: {
    isMobile:           { type: Boolean, default: false },
    statsPreCalculados: Object
  },
  template: '#card-vencimentos-template',

  data: function() {
    return {
    };
  },

  computed: {
    vencimentos: function() {
      var stats = this.statsPreCalculados;
      if (!stats || !stats.distribuicaoVencimentos) return [];
      return stats.distribuicaoVencimentos.filter(function(v) {
        return v.dataVencimento && v.dataVencimento !== 'N/A';
      });
    },

    isEmpty: function() {
      return !this.vencimentos || this.vencimentos.length === 0;
    },

    maxNocional: function() {
      var max = 0;
      this.vencimentos.forEach(function(v) {
        var n = parseFloat(v.nocional) || 0;
        if (n > max) max = n;
      });
      return max;
    },

    totalPosicoes: function() {
      var t = 0;
      this.vencimentos.forEach(function(v) { t += (parseInt(v.contagem) || 0); });
      return t;
    },

    urgente: function() {
      var datas = 0, pos = 0, self = this;
      this.vencimentos.forEach(function(v) {
        if (self.calcDTE(v.dataVencimento) <= 15) { datas++; pos += (parseInt(v.contagem) || 0); }
      });
      return { datas: datas, pos: pos };
    },

    atencao: function() {
      var datas = 0, pos = 0, self = this;
      this.vencimentos.forEach(function(v) {
        var d = self.calcDTE(v.dataVencimento);
        if (d > 15 && d <= 45) { datas++; pos += (parseInt(v.contagem) || 0); }
      });
      return { datas: datas, pos: pos };
    },

    conforto: function() {
      var datas = 0, pos = 0, self = this;
      this.vencimentos.forEach(function(v) {
        if (self.calcDTE(v.dataVencimento) > 45) { datas++; pos += (parseInt(v.contagem) || 0); }
      });
      return { datas: datas, pos: pos };
    },

    totais: function() {
      var nocional = 0, ganhoMaximo = 0, plAberto = 0;
      this.vencimentos.forEach(function(v) {
        nocional    += (parseFloat(v.nocional)    || 0);
        ganhoMaximo += (parseFloat(v.ganhoMaximo) || 0);
        plAberto    += (parseFloat(v.plAberto)    || 0);
      });
      return { nocional: nocional, ganhoMaximo: ganhoMaximo, plAberto: plAberto };
    }
  },

  methods: {
    // ── Drawer ────────────────────────────────────────────────────
    abrirDrawer: function(venc) {
      var self  = this;
      var alvo  = venc.dataVencimento;
      var lista = (self.statsPreCalculados && self.statsPreCalculados.listaAtivas)
        ? self.statsPreCalculados.listaAtivas : [];

      var ops = lista.filter(function(op) {
        var d = op.dataVencimento;
        if (!d) return false;
        var s = (d instanceof Date) ? d.toISOString().split('T')[0] : String(d).split('T')[0];
        return s === alvo;
      });

      ops.sort(function(a, b) {
        var ma = String(a.moneynessCode || '').toUpperCase();
        var mb = String(b.moneynessCode || '').toUpperCase();
        var order = { 'ITM': 0, 'ATM': 1, 'OTM': 2 };
        var va = order[ma] != null ? order[ma] : 3;
        var vb = order[mb] != null ? order[mb] : 3;
        return va - vb;
      });

      // Unificado: emite para o CardRadar (pai) abrir o drawer ÚNICO do Radar
      self.$emit('abrir-posicoes', { grupoLabel: 'Vencimento', titulo: self.fmtData(alvo), ops: ops });
    },

    // ── Cálculos de linha ─────────────────────────────────────────
    calcDTE: function(dataStr) {
      if (!dataStr) return 999;
      var hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      var s   = String(dataStr).split('T')[0];
      var pts = s.split('-');
      if (pts.length < 3) return 999;
      var venc = new Date(parseInt(pts[0]), parseInt(pts[1]) - 1, parseInt(pts[2]));
      return Math.max(0, Math.round((venc - hoje) / 86400000));
    },

    corDTE: function(dte) {
      if (dte <= 15) return { text: 'var(--brand-rose)',    bg: 'var(--brand-rose-light)',    border: 'var(--brand-rose-muted)',    label: 'URGENTE'  };
      if (dte <= 45) return { text: 'var(--brand-amber)',   bg: 'var(--brand-amber-light)',   border: 'var(--brand-amber-muted)',   label: 'ATENÇÃO'  };
      return           { text: 'var(--brand-emerald)', bg: 'var(--brand-emerald-light)', border: 'var(--brand-emerald-muted)', label: 'CONFORTO' };
    },

    barPct: function(nocional) {
      var max = this.maxNocional;
      if (!max) return 0;
      return Math.round((parseFloat(nocional) / max) * 100);
    },

    // ── Formatadores ──────────────────────────────────────────────
    fmtData: function(v) {
      var F = window.Formatador;
      if (F && F.data) return F.data(v);
      if (!v) return '--';
      if (v instanceof Date) return v.toLocaleDateString('pt-BR');
      return String(v).split(' ')[0];
    },

    fmtMoeda: function(v) {
      var F = window.Formatador;
      if (F && F.moeda) return F.moeda(v);
      var n = parseFloat(v);
      if (isNaN(n)) return '--';
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    },

    fmtK: function(v) {
      var n = parseFloat(v);
      if (isNaN(n)) return '--';
      var abs = Math.abs(n), sign = n < 0 ? '-' : '';
      if (abs >= 1000000) return sign + 'R$ ' + (abs / 1000000).toFixed(1).replace('.', ',') + 'M';
      if (abs >= 1000)    return sign + 'R$ ' + (abs / 1000).toFixed(1).replace('.', ',') + 'k';
      return sign + 'R$ ' + abs.toFixed(0);
    },

    fmtSigned: function(v) {
      var n = parseFloat(v);
      if (isNaN(n)) return '--';
      var sign = n >= 0 ? '+' : '-';
      var abs  = Math.abs(n);
      if (abs >= 1000000) return sign + 'R$ ' + (abs / 1000000).toFixed(1).replace('.', ',') + 'M';
      if (abs >= 1000)    return sign + 'R$ ' + (abs / 1000).toFixed(1).replace('.', ',') + 'k';
      return sign + 'R$ ' + abs.toFixed(2).replace('.', ',');
    },

    yieldStr: function(ganho, nocional) {
      var g = parseFloat(ganho) || 0, n = parseFloat(nocional) || 0;
      if (!n) return '';
      return (g / n * 100).toFixed(1).replace('.', ',') + '% yield';
    },

    plPctStr: function(pl, nocional) {
      var p = parseFloat(pl) || 0, n = parseFloat(nocional) || 0;
      if (!n) return '';
      var pct = (p / n * 100).toFixed(1).replace('.', ',');
      return (p >= 0 ? '+' : '') + pct + '%';
    }
  },

  mounted:  function() { if (window.refreshIcons) window.refreshIcons(); },
  updated:  function() { if (window.refreshIcons) window.refreshIcons(); }
};
</script>


<template id="card-radar-template">
  <div style="width:100%;font-family:'Plus Jakarta Sans',sans-serif;">

    <!-- ══════════════════════════════════════════════════
         DRAWER DE DETALHE (sidebar deslizante à direita)
        <!-- DRAWER DE DETALHE -->
    <transition name="radar-drawer">
      <div v-if="drawer.aberto"
        style="position:fixed;top:0;right:0;bottom:0;width:90vw;max-width:90vw;z-index:1000;
               display:flex;flex-direction:column;background:var(--surface-base);
               box-shadow:-8px 0 40px rgba(0,0,0,0.18);border-left:1px solid var(--border-subtle);">

        <!-- Header do drawer -->
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-subtle);
                    background:var(--surface-overlay);">
          <div>
            <div style="font-size:0.65rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:0.15em;color:var(--text-muted);margin-bottom:3px;">
              {{ drawer.grupoLabel }}
            </div>
            <div style="font-size:1.05rem;font-weight:800;color:var(--text-primary);letter-spacing:-0.02em;">
              {{ drawer.titulo }}
            </div>
          </div>
          <button @click="fecharDrawer"
            style="width:32px;height:32px;border-radius:50%;border:1px solid var(--border-subtle);
                   background:var(--surface-base);cursor:pointer;display:flex;align-items:center;
                   justify-content:center;color:var(--text-muted);font-size:1rem;transition:all 0.15s;">
            ✕
          </button>
        </div>

        <!-- Sumário do grupo -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
                    background:var(--border-subtle);border-bottom:1px solid var(--border-subtle);">
          <div style="background:var(--surface-base);padding:1rem 1.25rem;">
            <div style="font-size:0.65rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:0.1em;color:var(--text-muted);margin-bottom:4px;">Posições</div>
            <div style="font-size:1.5rem;font-weight:800;color:var(--text-primary);

<style>
  @keyframes radar-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .radar-drawer-enter-active,
  .radar-drawer-leave-active { transition: transform 0.3s cubic-bezier(0.2,0,0,1); }
  .radar-drawer-enter-from,
  .radar-drawer-leave-to    { transform: translateX(100%); }
  .radar-drawer-enter-to,
  .radar-drawer-leave-from  { transform: translateX(0); }


  .radar-bar-indigo { background:var(--brand-indigo); }

  /* Tooltip trigger */
  .cr-tip { cursor:help; }
  .cr-tip:hover svg, .cr-tip:hover { opacity:1 !important; }

  /* Tooltip global (renderizado no body via JS -- acima de tudo) */
  #cr-tooltip {
    position:fixed;
    z-index:2147483647;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }

  /* Aba Calendário: achata o card do CardVencimentos p/ ficar plano como as demais abas.
     Mira só o card PRINCIPAL (filho direto da raiz) — os cards do drawer não são afetados. */
  .radar-aba-calendario > div > .premium-card {
    border: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
  }

  /* Lista do drawer: responsiva pela LARGURA DO CONTAINER (não da viewport nem do isMobile).
     auto-fill + minmax(280px) => colapsa sozinho para 1 coluna quando o drawer é estreito
     (mobile/tablet/janela estreita) e abre colunas de >=280px quando é largo (desktop).
     Nunca espreme/corta os cards abaixo de 280px. */
  .cr-drawer-list {
    display: grid;
    grid-template-columns: 1fr;            /* mobile (< 1024px): SEMPRE 1 coluna */
    grid-auto-rows: max-content;
    gap: 0.75rem;
    align-content: start;
  }
  @media (min-width: 1024px) {            /* desktop: multi-coluna conforme a largura (>=280px) */
    .cr-drawer-list { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  }
  /* No mobile o menu é uma barra fixa embaixo (z-index acima do drawer).
     Folga no fim da lista p/ o último card terminar ACIMA do menu (sem cortar). */
  @media (max-width: 1023px) {
    .cr-drawer-list { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)) !important; }
  }
</style>

<script>
window.CardRadar = {
  props: {
    statsPreCalculados: Object,
    isMobile:           Boolean,
    isLoading:          Boolean
  },
  template: '#card-radar-template',

  // CardVencimentos absorvido: registrado localmente (definição no topo deste arquivo)
  components: { 'card-vencimentos': window.CardVencimentos },

  data: function() {
    return {
      abaAtiva: 'ciclo',
      radarAbas: [
        { key: 'ciclo',      label: 'Ciclo' },
        { key: 'premio',     label: 'Prêmio Capturado' },
        { key: 'ativo',      label: 'Concentração' },
        { key: 'calendario', label: 'Calendário' },
        { key: 'moneyness',  label: 'Moneyness' },
        { key: 'lucroPrej',  label: 'Lucro / Prejuízo' },
        { key: 'notional',   label: 'Notional' },
        { key: 'acoes',      label: 'Ações' }
      ],
      painelAcoes:          [],     // [{ticker,nome,preco,variacao,serie,spark}]
      painelAcoesCarregado: false,
      painelAcoesCarregando:false,
      drawer: {
        aberto:     false,
        tipo:       '',
        filtro:     '',
        titulo:     '',
        grupoLabel: '',
        ops:        []
      }
    };
  },

  computed: {
    operacoes: function() {
      var s = this.statsPreCalculados;
      return (s && s.listaAtivas) ? s.listaAtivas : [];
    },

    // Cada posicao ganha nocionalEfetivo (risco LIQUIDO): PUT vendida = sua fatia do
    // liquido do grupo ticker+venc (vendidas - proteção comprada); PUT comprada = 0
    // (proteção, ja abatida); CALL vendida = nocional cheio (coberta). Base de TODAS
    // as somas de nocional do card, para refletir corretamente as travas.
    opsComEfetivo: function() {
      return this._enriquecerEfetivo(this.operacoes);
    },

    totalNocional: function() {
      return this.opsComEfetivo.reduce(function(s, o) { return s + (o.nocionalEfetivo || 0); }, 0);
    },

    putNetting: function() {
      var grupos = {}; var ordem = [];
      this.operacoes.forEach(function(o) {
        var tipo = String(o.tipoOpcao||'').toUpperCase();
        if (tipo.indexOf('PUT') < 0) return;
        var dir = String(o.direcaoTrade||'').toUpperCase();
        var venda = dir.indexOf('VENDA') >= 0;
        var dStr = o.dataVencimento ? String(o.dataVencimento).split('T')[0] : '';
        var key = (o.tickerAtivo||'')+'|'+dStr;  // ticker+venc: netta a protecao da trava (strikes diferentes)
        if (!grupos[key]) { grupos[key]={ticker:o.tickerAtivo,vendaNoc:0,compraNoc:0,vendaOps:[],compraOps:[],creditoPut:0}; ordem.push(key); }
        var noc = parseFloat(o.nocional)||0;
        // Crédito líquido da estrutura = Σ ganhoMaximo das pernas PUT (venda entra +, compra entra −)
        grupos[key].creditoPut += (parseFloat(o.ganhoMaximo)||0);
        if (venda) { grupos[key].vendaNoc+=noc; grupos[key].vendaOps.push(o); }
        else       { grupos[key].compraNoc+=noc; grupos[key].compraOps.push(o); }
      });
      return ordem.map(function(k){
        var g=grupos[k];
        // Só abate o prêmio quando há PUT protetora (trava). PUT vendida a seco mantém o nocional cheio.
        var credito = g.compraOps.length > 0 ? Math.max(0, g.creditoPut) : 0;
        var brutoLiq = Math.max(0, g.vendaNoc - g.compraNoc);
        return Object.assign({},g,{key:k, creditoNoc:credito, liquidoNoc:Math.max(0, brutoLiq - credito)});
      });
    },

    totalNocionalPut: function() { return this.putNetting.reduce(function(a,g){return a+g.liquidoNoc;},0); },       // risco liquido (vendidas - proteção - prêmio das travas)
    totalNocionalPutBruto: function() { return this.putNetting.reduce(function(a,g){return a+g.vendaNoc;},0); },    // desembolso bruto (todas vendidas)
    totalNocionalPutDesmontagem: function() { return this.putNetting.reduce(function(a,g){return a+g.compraNoc;},0); }, // proteção (todas compradas)
    totalNocionalPutCredito: function() { return this.putNetting.reduce(function(a,g){return a+g.creditoNoc;},0); }, // prêmio líquido recebido nas travas

    // Memoria de calculo do risco nocional: por vencimento -> ticker (vendas x proteção).
    // Reconcilia exatamente com putNetting (mesmo agrupamento e clamp).
    notionalMemoria: function() {
      var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      var vmap = {}; var vordem = [];
      this.operacoes.forEach(function(o) {
        if (String(o.tipoOpcao || '').toUpperCase().indexOf('PUT') < 0) return;
        var d = o.dataVencimento instanceof Date ? o.dataVencimento : new Date(o.dataVencimento);
        if (isNaN(d.getTime())) return;
        var chave = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        if (!vmap[chave]) {
          vmap[chave] = { chave: chave, label: String(d.getDate()).padStart(2,'0') + '/' + meses[d.getMonth()] + '/' + String(d.getFullYear()).slice(2), tickers: {}, tOrdem: [] };
          vordem.push(chave);
        }
        var t = o.tickerAtivo || 'N/A';
        if (!vmap[chave].tickers[t]) { vmap[chave].tickers[t] = { ticker: t, vendaNoc: 0, compraNoc: 0, vendaN: 0, compraN: 0, creditoPut: 0 }; vmap[chave].tOrdem.push(t); }
        var noc = parseFloat(o.nocional) || 0;
        var tk = vmap[chave].tickers[t];
        tk.creditoPut += (parseFloat(o.ganhoMaximo) || 0);   // Σ ganhoMaximo das pernas PUT (venda +, compra −)
        if (String(o.direcaoTrade || '').toUpperCase().indexOf('VENDA') >= 0) { tk.vendaNoc += noc; tk.vendaN++; }
        else { tk.compraNoc += noc; tk.compraN++; }
      });
      vordem.sort();
      return vordem.map(function(chave) {
        var v = vmap[chave];
        var tickers = v.tOrdem.map(function(t) {
          var tk = v.tickers[t];
          // Só abate prêmio quando há PUT protetora (trava); PUT a seco fica no nocional cheio.
          var credito = tk.compraN > 0 ? Math.max(0, tk.creditoPut) : 0;
          return { ticker: tk.ticker, vendaNoc: tk.vendaNoc, compraNoc: tk.compraNoc, credito: credito, liquido: Math.max(0, tk.vendaNoc - tk.compraNoc - credito), vendaN: tk.vendaN, compraN: tk.compraN };
        }).sort(function(a, b) { return b.liquido - a.liquido; });
        return {
          chave: v.chave, label: v.label, tickers: tickers,
          bruto:    tickers.reduce(function(s, x) { return s + x.vendaNoc; }, 0),
          protecao: tickers.reduce(function(s, x) { return s + x.compraNoc; }, 0),
          credito:  tickers.reduce(function(s, x) { return s + x.credito; }, 0),
          liquido:  tickers.reduce(function(s, x) { return s + x.liquido; }, 0)
        };
      });
    },

    totalNocionalCall: function() {
      return this.operacoes.filter(function(o){ return String(o.tipoOpcao||'').toUpperCase().indexOf('CALL')>=0 && String(o.direcaoTrade||'').toUpperCase().indexOf('VENDA')>=0; }).reduce(function(a,o){return a+(parseFloat(o.nocional)||0);},0);
    },

    totalPL: function() {
      return this.operacoes.reduce(function(s, o) { return s + (parseFloat(o.plTotalValor) || 0); }, 0);
    },

    // -- MONEYNESS ---
    moneynessVisoes: function() {
      var ops = this.opsComEfetivo;
      var total = ops.length || 1;
      var grupos = {
        OTM: { count: 0, nocional: 0 },
        ATM: { count: 0, nocional: 0 },
        ITM: { count: 0, nocional: 0 }
      };
      ops.forEach(function(o) {
        var c = String(o.moneynessCode || '').toUpperCase();
        var key = c.indexOf('OTM') >= 0 ? 'OTM' : c.indexOf('ATM') >= 0 ? 'ATM' : c.indexOf('ITM') >= 0 ? 'ITM' : null;
        if (key) { grupos[key].count++; grupos[key].nocional += o.nocionalEfetivo || 0; }
      });
      return [
        { code: 'OTM', label: 'Out of the Money', count: grupos.OTM.count, nocional: grupos.OTM.nocional, pct: Math.round((grupos.OTM.count / total) * 100), color: 'var(--brand-emerald)', badgeStyle: 'background:var(--brand-emerald-light);color:var(--brand-emerald);border-color:var(--brand-emerald-muted);' },
        { code: 'ATM', label: 'At the Money',     count: grupos.ATM.count, nocional: grupos.ATM.nocional, pct: Math.round((grupos.ATM.count / total) * 100), color: 'var(--brand-amber)',   badgeStyle: 'background:var(--brand-amber-light);color:var(--brand-amber);border-color:var(--brand-amber-muted);' },
        { code: 'ITM', label: 'In the Money',     count: grupos.ITM.count, nocional: grupos.ITM.nocional, pct: Math.round((grupos.ITM.count / total) * 100), color: 'var(--brand-rose)',    badgeStyle: 'background:var(--brand-rose-light);color:var(--brand-rose);border-color:var(--brand-rose-muted);' }
      ];
    },

    // -- TIPO (CALL / PUT) ---
    tipoVisoes: function() {
      var ops = this.operacoes;
      var r = { CALL: { count: 0, nocional: 0 }, PUT: { count: 0, nocional: 0 } };
      ops.forEach(function(o) {
        var t = String(o.tipoOpcao || '').toUpperCase();
        if (t.indexOf('CALL') >= 0) { r.CALL.count++; r.CALL.nocional += parseFloat(o.nocional) || 0; }
        else if (t.indexOf('PUT') >= 0) { r.PUT.count++; r.PUT.nocional += parseFloat(o.nocional) || 0; }
      });
      return [
        { tipo: 'CALL', label: 'Venda CALL', count: r.CALL.count, nocional: r.CALL.nocional },
        { tipo: 'PUT',  label: 'Venda PUT',  count: r.PUT.count,  nocional: r.PUT.nocional  }
      ];
    },

    // -- CONCENTRACAO POR TICKER ---
    tickerVisoes: function() {
      var ops = this.opsComEfetivo;
      var totalNoc = this.totalNocional || 1;
      var mapa = {};
      ops.forEach(function(o) {
        var t = o.tickerAtivo || 'N/A';
        if (!mapa[t]) mapa[t] = {
          ticker: t, count: 0, nocional: 0, pl: 0,
          OTM: { count: 0, nocional: 0 },
          ATM: { count: 0, nocional: 0 },
          ITM: { count: 0, nocional: 0 }
        };
        var mon = String(o.moneynessCode || '').toUpperCase();
        var col = mon.indexOf('OTM') >= 0 ? 'OTM' : mon.indexOf('ATM') >= 0 ? 'ATM' : mon.indexOf('ITM') >= 0 ? 'ITM' : null;
        mapa[t].count++;
        mapa[t].nocional += o.nocionalEfetivo          || 0;
        mapa[t].pl       += parseFloat(o.plTotalValor) || 0;
        if (col) {
          mapa[t][col].count++;
          mapa[t][col].nocional += o.nocionalEfetivo || 0;
        }
      });
      return Object.keys(mapa)
        .map(function(t) {
          var noc = mapa[t].nocional;
          var pl  = mapa[t].pl;
          return {
            ticker: mapa[t].ticker, count: mapa[t].count, nocional: noc,
            pct:    Math.round((noc / totalNoc) * 100),
            pl:     pl,
            plPct:  noc > 0 ? (pl / noc * 100).toFixed(1) : '0.0',
            OTM: mapa[t].OTM, ATM: mapa[t].ATM, ITM: mapa[t].ITM
          };
        })
        .sort(function(a, b) { return b.nocional - a.nocional; });
    },

    // -- P/L STATUS ---
    plVisao: function() {
      var ops = this.opsComEfetivo;
      var r = { lucro: 0, breakeven: 0, prejuizo: 0, nocionalLucro: 0, nocionalBreakeven: 0, nocionalPrejuizo: 0 };
      ops.forEach(function(o) {
        var pl  = parseFloat(o.plTotalValor) || 0;
        var noc = o.nocionalEfetivo || 0;
        if      (pl >  0.01) { r.lucro++;     r.nocionalLucro      += noc; }
        else if (pl < -0.01) { r.prejuizo++;  r.nocionalPrejuizo   += noc; }
        else                 { r.breakeven++; r.nocionalBreakeven  += noc; }
      });
      var total = ops.length || 1;
      r.pctLucro     = Math.round((r.lucro     / total) * 100);
      r.pctBreakeven = Math.round((r.breakeven / total) * 100);
      r.pctPrejuizo  = Math.round((r.prejuizo  / total) * 100);
      return r;
    },

    // -- CICLO DE VENCIMENTO ---
    cicloVisoes: function() {
      var ops = this.operacoes;
      var totalNoc = this.totalNocional || 1;
      var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      var hoje = new Date();
      var mapa = {};
      var ordem = [];

      // Ciclo: nocional principal = V PUT liquida. Saves desmont for display.
      this.putNetting.forEach(function(g) {
        if (g.liquidoNoc <= 0 || g.vendaOps.length === 0) return;
        var rep = g.vendaOps[0]; // op representativa
        var d = rep.dataVencimento instanceof Date ? rep.dataVencimento : new Date(rep.dataVencimento);
        if (isNaN(d.getTime())) return;
        var chave = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        var label = meses[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
        if (!mapa[chave]) {
          mapa[chave] = {
            chave: chave, label: label, count: 0, nocional: 0, nocionalDesmont: 0, pl: 0,
            mes: d.getMonth(), ano: d.getFullYear(),
            OTM: { count: 0, nocional: 0 },
            ATM: { count: 0, nocional: 0 },
            ITM: { count: 0, nocional: 0 }
          };
          ordem.push(chave);
        }
        var mon = String(rep.moneynessCode || '').toUpperCase();
        var col = mon.indexOf('OTM') >= 0 ? 'OTM' : mon.indexOf('ATM') >= 0 ? 'ATM' : mon.indexOf('ITM') >= 0 ? 'ITM' : null;
        mapa[chave].count += g.vendaOps.length;
        mapa[chave].nocional += g.liquidoNoc;
        mapa[chave].nocionalDesmont += g.compraNoc;
        g.vendaOps.forEach(function(op){ mapa[chave].pl += parseFloat(op.plTotalValor)||0; });
        if (col) { mapa[chave][col].count += g.vendaOps.length; mapa[chave][col].nocional += g.liquidoNoc; }
      });
      // P/L das compras de desmontagem tb entram no P/L do ciclo
      ops.forEach(function(o) {
        var tipo = String(o.tipoOpcao||'').toUpperCase();
        var dir  = String(o.direcaoTrade||'').toUpperCase();
        if (tipo.indexOf('PUT') < 0 || dir.indexOf('COMPRA') < 0) return;
        var d = o.dataVencimento instanceof Date ? o.dataVencimento : new Date(o.dataVencimento);
        if (isNaN(d.getTime())) return;
        var chave = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (mapa[chave]) mapa[chave].pl += parseFloat(o.plTotalValor)||0;
      });

      var maxNoc = 1;
      ordem.forEach(function(k) { if (mapa[k].nocional > maxNoc) maxNoc = mapa[k].nocional; });

      ordem.sort();
      return ordem.map(function(k) {
        var v = mapa[k];
        var isCurrent = v.ano === hoje.getFullYear() && v.mes === hoje.getMonth();
        var badgeStyle = isCurrent
          ? 'background:var(--brand-indigo-light);color:var(--brand-indigo);border:1.5px solid var(--brand-indigo-muted);'
          : 'background:var(--surface-sunken);color:var(--text-secondary);border:1.5px solid var(--border-default);';
        return {
          chave:          v.chave,
          label:          v.label,
          count:          v.count,
          nocional:       v.nocional,
          nocionalDesmont:v.nocionalDesmont || 0,
          pl:             v.pl,
          pctNoc:         Math.round((v.nocional / maxNoc) * 100),
          badgeStyle:     badgeStyle,
          barClass:       'radar-bar-indigo',
          plStyle:        v.pl >= 0 ? 'color:var(--brand-emerald);' : 'color:var(--brand-rose);',
          OTM:            v.OTM,
          ATM:            v.ATM,
          ITM:            v.ITM
        };
      });
    },

    cicloCorrente: function() {
      var hoje = new Date();
      var mes  = hoje.getMonth() + 1;
      var ano  = hoje.getFullYear();
      var chave = ano + '-' + String(mes).padStart(2, '0');
      for (var i = 0; i < this.cicloVisoes.length; i++) {
        if (this.cicloVisoes[i].chave === chave) return this.cicloVisoes[i];
      }
      return null;
    },

    // -- PRÊMIO CAPTURADO POR ATIVO ---
    // Max Ganho = soma dos prêmios recebidos (o máximo possível se tudo virar pó)
    // P/L Atual = quanto já foi realizado
    // % Capturada = P/L / MaxGanho -- o termômetro de cada posição
    riscoPorAtivo: function() {
      var ops  = this.operacoes;
      var mapa = {};
      var ordem = [];

      ops.forEach(function(o) {
        var t = o.tickerAtivo || 'N/A';
        if (!mapa[t]) {
          mapa[t] = { ticker: t, ganhoMax: 0, plAtual: 0, count: 0 };
          ordem.push(t);
        }
        mapa[t].ganhoMax += parseFloat(o.ganhoMaximo)  || 0;
        mapa[t].plAtual  += parseFloat(o.plTotalValor) || 0;
        mapa[t].count++;
      });

      return ordem
        .map(function(t) {
          var v       = mapa[t];
          var pctCap  = v.ganhoMax > 0 ? (v.plAtual / v.ganhoMax) * 100 : 0;
          // Barra: 0 a 100% = emerald, negativo = rose, >100% impossível mas clampa
          var barPct  = Math.min(100, Math.max(0, pctCap));
          var negPct  = pctCap < 0 ? Math.min(100, Math.abs(pctCap)) : 0;
          return {
            ticker:   v.ticker,
            ganhoMax: v.ganhoMax,
            plAtual:  v.plAtual,
            count:    v.count,
            pctCap:   pctCap,
            barPct:   barPct,
            negPct:   negPct
          };
        })
        .sort(function(a, b) { return b.pctCap - a.pctCap; });
    },
  },

    abaAtiva: function(nova) {

    }
  },

    this._initTooltipCR();
  },

  beforeUnmount: function() {
    var el = document.getElementById('cr-tooltip');
    if (el) el.remove();
    document.removeEventListener('mouseover', this._crTipOver);
    document.removeEventListener('mouseout',  this._crTipOut);
    document.removeEventListener('scroll',    this._crTipHide, true);
  },

  methods: {
    fmt: function(chave, valor) { return window.Formatador.campo(chave, valor); },
    fmtK: function(n) { return window.Formatador.moedaCompacta(n); },
    fmtMoedaCheia: function(v) { var n = parseFloat(v); if (isNaN(n)) return 'R$ 0'; return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); },

    // Preço com 2 casas (R$ 20,50) para o painel de Ações
    fmtPreco: function(v) {
      var n = parseFloat(v);
      if (isNaN(n)) return '--';
      return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },

    // ── Painel de Ações (estilo Google Finance) ───────────────────────────
    carregarPainelAcoes: function() {
      if (this.painelAcoesCarregado || this.painelAcoesCarregando) return;
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      var self = this;
      this.painelAcoesCarregando = true;
      google.script.run
        .withSuccessHandler(function(dados) {
          var lista = Array.isArray(dados) ? dados : [];
          lista.forEach(function(a) { a.spark = self._calcSpark(a.serie); });
          self.painelAcoes = lista;
          self.painelAcoesCarregado  = true;
          self.painelAcoesCarregando = false;
        })
        .withFailureHandler(function(err) {
          self.painelAcoesCarregando = false;
          console.warn('[CardRadar] Falha ao carregar painel de ações:', err);
        })
        .getPainelAcoes();
    },

    // Geometria de um sparkline SVG a partir da série de fechamentos.
    // O SVG é esticado horizontalmente (preserveAspectRatio=none) para
    // preencher a coluna; por isso o ponto final é posicionado por % (lastPct)
    // como marcador HTML, evitando virar elipse ao esticar.
    _calcSpark: function(serie) {
      if (!Array.isArray(serie) || serie.length < 2) return null;
      var W = 116, H = 30, padY = 3, n = serie.length;
      var min = Math.min.apply(null, serie), max = Math.max.apply(null, serie);
      var range = (max - min) || 1;
      var xy = serie.map(function(v, i) {
        var x = (i / (n - 1)) * W;                              // sem padding horizontal → linha preenche a largura
        var y = padY + (1 - (v - min) / range) * (H - 2 * padY);
        return [x, y];
      });
      var pts  = xy.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L');
      var line = 'M' + pts;
      var area = 'M' + xy[0][0].toFixed(1) + ',' + H + ' L' + pts + ' L' + xy[n - 1][0].toFixed(1) + ',' + H + ' Z';
      var up   = serie[n - 1] >= serie[0];
      return {
        W: W, H: H, line: line, area: area,
        baseY:    xy[0][1].toFixed(1),
        lastXPct: ((xy[n - 1][0] / W) * 100).toFixed(1),
        lastPct:  ((xy[n - 1][1] / H) * 100).toFixed(1),
        cor: up ? 'var(--brand-emerald)' : 'var(--brand-rose)'
      };
    },

    abrirDrawer: function(tipo, filtro, titulo) {
      var ops = this.opsComEfetivo;
      var filtered = [];

      if (tipo === 'moneyness') {
        filtered = ops.filter(function(o) { return String(o.moneynessCode || '').toUpperCase().indexOf(filtro) >= 0; });
      } else if (tipo === 'tipo') {
        filtered = ops.filter(function(o) { return String(o.tipoOpcao || '').toUpperCase().indexOf(filtro) >= 0; });
      } else if (tipo === 'ciclo') {
        filtered = ops.filter(function(o) {
          var d = o.dataVencimento instanceof Date ? o.dataVencimento : new Date(o.dataVencimento);
          if (isNaN(d.getTime())) return false;
          var chave = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          return chave === filtro;
        });
      } else if (tipo === 'cicloMoney') {
        var parts2   = filtro.split('|');
        var cChave   = parts2[0];
        var cMoney   = parts2[1];
        filtered = ops.filter(function(o) {
          var d = o.dataVencimento instanceof Date ? o.dataVencimento : new Date(o.dataVencimento);
          if (isNaN(d.getTime())) return false;
          var chave = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          var mon = String(o.moneynessCode || '').toUpperCase();
          var col = mon.indexOf('OTM') >= 0 ? 'OTM' : mon.indexOf('ATM') >= 0 ? 'ATM' : mon.indexOf('ITM') >= 0 ? 'ITM' : '';
          return chave === cChave && col === cMoney;
        });
      } else if (tipo === 'ticker') {
        filtered = ops.filter(function(o) { return o.tickerAtivo === filtro; });
      } else if (tipo === 'heatmap') {
        var parts   = filtro.split('|');
        var hticker = parts[0];
        var hmoney  = parts[1];
        filtered = ops.filter(function(o) {
          var mon = String(o.moneynessCode || '').toUpperCase();
          var col = mon.indexOf('OTM') >= 0 ? 'OTM' : mon.indexOf('ATM') >= 0 ? 'ATM' : mon.indexOf('ITM') >= 0 ? 'ITM' : '';
          return o.tickerAtivo === hticker && col === hmoney;
        });
      } else if (tipo === 'pl') {
        filtered = ops.filter(function(o) {
          var pl = parseFloat(o.plTotalValor) || 0;
          if (filtro === 'lucro')     return pl >  0.01;
          if (filtro === 'prejuizo')  return pl < -0.01;
          if (filtro === 'breakeven') return Math.abs(pl) <= 0.01;
          return false;
        });
      }

      var labelMap = {
        moneyness: 'Moneyness',
        tipo:      'Tipo de Opcao',
        ciclo:     'Ciclo de Vencimento',
        cicloMoney:'Ciclo x Moneyness',
        ticker:    'Ativo',
        heatmap:   'Heatmap Ativo x Moneyness',
        pl:        'P/L Status'
      };

      this.drawer.tipo       = tipo;
      this.drawer.filtro     = filtro;
      this.drawer.titulo     = titulo;
      this.drawer.grupoLabel = labelMap[tipo] || tipo;
      this.drawer.ops        = filtered;
      this.drawer.aberto     = true;
    },

    // Recebe posições do calendário (CardVencimentos) e abre ESTE drawer unificado
    abrirDrawerVencimento: function(payload) {
      payload = payload || {};
      this.drawer.tipo       = 'vencimento';
      this.drawer.filtro     = '';
      this.drawer.titulo     = payload.titulo || '';
      this.drawer.grupoLabel = payload.grupoLabel || 'Vencimento';
      this.drawer.ops        = this._enriquecerEfetivo(payload.ops || []);
      this.drawer.aberto     = true;
    },

    fecharDrawer: function() {
      this.drawer.aberto = false;
    },

    // Netting da proteção das travas: devolve as ops com nocionalEfetivo (ver opsComEfetivo).
    // Agrupa PUTs por ticker+vencimento; liquido do grupo = max(0, Σvendidas - Σcompradas);
    // cada PUT vendida recebe sua fatia proporcional do liquido; PUT comprada = 0.
    _enriquecerEfetivo: function(ops) {
      ops = ops || [];
      var grp = {};
      ops.forEach(function(o) {
        if (String(o.tipoOpcao || '').toUpperCase().indexOf('PUT') < 0) return;
        var dStr = o.dataVencimento ? String(o.dataVencimento).split('T')[0] : '';
        var key  = (o.tickerAtivo || '') + '|' + dStr;
        if (!grp[key]) grp[key] = { sold: 0, bought: 0 };
        var noc = parseFloat(o.nocional) || 0;
        if (String(o.direcaoTrade || '').toUpperCase().indexOf('VENDA') >= 0) grp[key].sold += noc;
        else grp[key].bought += noc;
      });
      Object.keys(grp).forEach(function(k) { grp[k].net = Math.max(0, grp[k].sold - grp[k].bought); });
      return ops.map(function(o) {
        var tipo  = String(o.tipoOpcao || '').toUpperCase();
        var venda = String(o.direcaoTrade || '').toUpperCase().indexOf('VENDA') >= 0;
        var noc   = parseFloat(o.nocional) || 0;
        var efet;
        if (tipo.indexOf('PUT') >= 0) {
          if (!venda) { efet = 0; }
          else {
            var dStr = o.dataVencimento ? String(o.dataVencimento).split('T')[0] : '';
            var g = grp[(o.tickerAtivo || '') + '|' + dStr];
            efet = (g && g.sold > 0) ? g.net * (noc / g.sold) : noc;
          }
        } else {
          efet = venda ? noc : 0;   // CALL vendida = coberta; comprada/naked = 0
        }
        return Object.assign({}, o, { nocionalEfetivo: efet });
      });
    },

    somaDrawer: function(campo) {
      return this.drawer.ops.reduce(function(s, o) { return s + (parseFloat(o[campo]) || 0); }, 0);
    },

    // ── Helpers dos cards do drawer — identicos ao CarouselAtivas ──────────
    drawerCardIcon: function(op) {
      var mc = String(op.moneynessCode || '').toUpperCase();
      if (mc.indexOf('ITM') >= 0) return '🚨';
      if (mc.indexOf('ATM') >= 0) return '⚠️';
      return '✅';
    },

    drawerCardBorder: function(op) {
      var mc = String(op.moneynessCode || '').toUpperCase();
      if (mc.indexOf('ITM') >= 0) return 'border-color:var(--brand-rose-muted);background:var(--brand-rose-light);';
      if (mc.indexOf('ATM') >= 0) return 'border-color:var(--brand-amber-muted);background:var(--brand-amber-light);';
      return 'border-color:var(--brand-emerald-muted);background:var(--brand-emerald-light);';
    },

    drawerFooterStyle: function(op) {
      var mc = String(op.moneynessCode || '').toUpperCase();
      if (mc.indexOf('ITM') >= 0) return 'background:var(--brand-rose-light);border-color:var(--brand-rose-muted);color:var(--brand-rose);';
      if (mc.indexOf('ATM') >= 0) return 'background:var(--brand-amber-light);border-color:var(--brand-amber-muted);color:var(--brand-amber);';
      return 'background:var(--brand-emerald-light);border-color:var(--brand-emerald-muted);color:var(--brand-emerald);';
    },

    drawerBreakEven: function(op) {
      var F = window.Formatador;
      if (op.breakEven && parseFloat(op.breakEven) > 0) {
        return F ? F.moeda(op.breakEven) : 'R$' + parseFloat(op.breakEven).toFixed(2);
      }
      var pm = parseFloat(op.premioMedio || 0);
      var sk = parseFloat(op.strike      || 0);
      if (sk > 0) {
        var be = sk - pm;
        return F ? F.moeda(be) : 'R$' + be.toFixed(2);
      }
      return '—';
    },

    drawerPlPct: function(v) {
      var n = parseFloat(v || 0);
      if (isNaN(n)) return '—';
      return (n * 100).toFixed(2).replace('.', ',') + '%';
    },

    drawerLucroMax: function(v) {
      var n = parseFloat(v || 0);
      if (isNaN(n)) return '—';
      return (n * 100).toFixed(2).replace('.', ',') + '%';
    },

    fmtDistPct: function(v) {
      var F = window.Formatador;
      if (F && F.distanciaPct) return F.distanciaPct(v);
      if (v == null) return '—';
      var n = parseFloat(v);
      return (n >= 0 ? '+' : '') + n.toFixed(1).replace('.', ',') + '%';
    },

    getMoneynessStyle: function(code) {
      var c = String(code || '').toUpperCase();
      if (c.indexOf('ITM') >= 0) return 'background:var(--brand-rose-light);color:var(--brand-rose);border-color:var(--brand-rose-muted);';
      if (c.indexOf('ATM') >= 0) return 'background:var(--brand-amber-light);color:var(--brand-amber);border-color:var(--brand-amber-muted);';
      if (c.indexOf('OTM') >= 0) return 'background:var(--brand-emerald-light);color:var(--brand-emerald);border-color:var(--brand-emerald-muted);';
      return 'background:var(--surface-overlay);color:var(--text-muted);border-color:var(--border-default);';
    },

    getTipoStyle: function(tipo) {
      var t = String(tipo || '').toUpperCase();
      if (t.indexOf('CALL') >= 0) return 'background:var(--brand-indigo-light);color:var(--brand-indigo);border-color:var(--brand-indigo-muted);';
      if (t.indexOf('PUT')  >= 0) return 'background:var(--brand-rose-light);color:var(--brand-rose);border-color:var(--brand-rose-muted);';
      return 'background:var(--surface-overlay);color:var(--text-muted);border-color:var(--border-default);';
    },

    // ── SISTEMA DE TOOLTIP GLOBAL ─────────────────────────────────────────
    // Injetado no body -- z-index maximo, nunca cortado por overflow:hidden
    _initTooltipCR: function() {
      var self = this;
      if (document.getElementById('cr-tooltip')) return;

      var el = document.createElement('div');
      el.id = 'cr-tooltip';
      Object.assign(el.style, {
        position:      'fixed',
        zIndex:        '2147483647',
        pointerEvents: 'none',
        background:    getComputedStyle(document.documentElement).getPropertyValue('--surface-overlay').trim() || '#1e1e2e',
        border:        '1px solid ' + (getComputedStyle(document.documentElement).getPropertyValue('--border-default').trim() || '#3a3a5c'),
        borderRadius:  '8px',
        padding:       '8px 11px',
        width:         '240px',
        maxWidth:      '90vw',
        fontSize:      '0.7rem',
        fontWeight:    '400',
        lineHeight:    '1.55',
        color:         getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#aaa',
        boxShadow:     '0 12px 32px rgba(0,0,0,0.5)',
        opacity:       '0',
        transition:    'opacity 0.15s ease',
        whiteSpace:    'normal',
        wordBreak:     'break-word'
      });
      document.body.appendChild(el);
      self._crTipEl = el;

      self._crTipHide = function() { el.style.opacity = '0'; };

      self._crTipShow = function(texto, triggerEl) {
        if (!texto || !triggerEl) return;
        el.textContent = texto;
        var rect = triggerEl.getBoundingClientRect();
        var w    = 240;
        var gap  = 10;
        var left = rect.left + rect.width / 2 - w / 2;
        if (left < 8) left = 8;
        if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
        el.style.opacity = '0';
        el.style.left    = left + 'px';
        el.style.top     = '-9999px';
        var h = el.offsetHeight || 60;
        var top = rect.top - h - gap;
        if (top < 8) top = rect.bottom + gap;
        el.style.top     = top + 'px';
        el.style.opacity = '1';
      };

      self._crTipOver = function(e) {
        var t = e.target.closest('.cr-tip');
        if (!t) return;
        var txt = t.getAttribute('data-tip');
        if (!txt) return;
        clearTimeout(self._crTipTimer);
        self._crTipShow(txt, t);
      };

      self._crTipOut = function(e) {
        var t = e.target.closest('.cr-tip');
        if (!t) return;
        self._crTipTimer = setTimeout(self._crTipHide, 80);
      };

      document.addEventListener('mouseover', self._crTipOver);
      document.addEventListener('mouseout',  self._crTipOut);
      document.addEventListener('scroll',    self._crTipHide, true);
    }
  }
};
</script>
